name: CI
on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arena
          POSTGRES_PASSWORD: arena
          POSTGRES_DB: arena_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://arena:arena@localhost:5432/arena_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publishes the APK as a release for in-app updates
    defaults:
      run:
        working-directory: client
    env:
      # Every build gets a higher version so the app can offer it as an update.
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.4.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleRelease --stacktrace -PversionCode=$((VERSION_CODE + 100)) -PversionName=$VERSION_NAME
      - uses: actions/upload-artifact@v4
        with:
          name: arena-debug-apk
          path: client/app/build/outputs/apk/release/*.apk
      - name: Publish the APK for in-app updates
        if: github.event_name == 'push' && github.ref == 'refs/heads/claude/project-thread-6laoi3'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk arena.apk
          echo "{\"versionCode\": $((VERSION_CODE + 100)), \"versionName\": \"$VERSION_NAME\"}" > version.json
          gh release create "android-$VERSION_CODE" arena.apk version.json \
            --target "$GITHUB_SHA" --title "Арена бойцов $VERSION_NAME" --notes "Сборка из $GITHUB_SHA" --latest
          # Keep only the newest few releases.
          gh release list --limit 100 --json tagName --jq '.[].tagName' | grep '^android-' | sort -t- -k2 -n -r | tail -n +4 |
            xargs -r -I{} gh release delete {} --yes --cleanup-tag
